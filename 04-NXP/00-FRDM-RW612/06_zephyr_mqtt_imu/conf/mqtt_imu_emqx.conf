# Broker settings
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="44.232.241.40"

# Keep the sample running
CONFIG_NET_SAMPLE_APP_MAX_ITERATIONS=1
CONFIG_NET_SAMPLE_APP_MAX_CONNECTIONS=0

# Wi-Fi / IPv4 network configuration
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y

# Enable Wi-Fi shell commands
CONFIG_NET_L2_WIFI_SHELL=y

# Disable Ethernet so the app does not wait for the KSZ8081 PHY
CONFIG_ETH_DRIVER=n

# Stack and buffer tuning for RW612 Wi-Fi + MQTT
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024

# Network management stability
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Optional diagnostics
CONFIG_INIT_STACKS=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
CONFIG_WIFI_LOG_LEVEL_ERR=y

# ============================================================================
# MPU6050 IMU support
# ============================================================================

CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y